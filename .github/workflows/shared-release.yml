# Shared changesets release workflow.
#
# Either opens/updates the "[RELEASE] Update package versions" PR or publishes to npm, depending on
# whether unreleased changesets exist.
name: Shared Release

on:
  workflow_call:
    inputs:
      version-command:
        description: "pnpm script that applies changesets and updates the working tree."
        type: string
        default: "ci:version"
      publish-command:
        description: "pnpm script that builds and publishes the packages."
        type: string
        default: "ci:publish"
      commit-message:
        type: string
        default: "[RELEASE] Update package versions"

    secrets:
      NPM_TOKEN:
        required: true

    outputs:
      published:
        description: "A string (true or false) that indicates whether packages were published."
        value: ${{ jobs.release.outputs.published }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install
        uses: open-pioneer/trails-repo-automation/.github/actions/install@main

      - name: Authenticate
        uses: open-pioneer/trails-repo-automation/.github/actions/npm-authenticate@dev
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

      - id: changesets
        name: Create Release Pull Request or Publish to npm
        # Unpinned today in all repos; renovate will pin the digest here once, for everyone.
        uses: changesets/action@v1
        with:
          version: "pnpm run ${{ inputs.version-command }}"
          publish: "pnpm run ${{ inputs.publish-command }}"
          commit: ${{ inputs.commit-message }}
          title: ${{ inputs.commit-message }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_VERIFY: "1" # don't run git hooks on simple version commits
