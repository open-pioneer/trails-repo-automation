# Shared issue triage: moves new issues to the maintenance board.
name: Shared New Issue

on:
  workflow_call:
    secrets:
      ISSUE_AUTOMATION_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  add-to-board:
    name: Add issue to board
    if: github.repository_owner == 'open-pioneer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assign to board
        uses: open-pioneer/trails-repo-automation/.github/actions/add-to-maintenance-board@main
        with:
          github-token: ${{ secrets.ISSUE_AUTOMATION_TOKEN }}
