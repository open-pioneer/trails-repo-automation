# Setup up node and pnpm dependencies
name: Install
description: Install pnpm dependencies
inputs:
  skip-install:
    description: Skip package installation. Use this when dependencies are not actually needed (e.g. audit).
    required: false
    default: false
runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        # No need to define specific pnpm version, "packageManager" should be set in package.json
        runtime: node@24.21.0
        cache: true
        require-lockfile: true # --frozen-lockfile
        install: ${{ inputs.skip-install != 'true' }}
