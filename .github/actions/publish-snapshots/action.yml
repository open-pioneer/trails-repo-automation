# Publishes package snapshots (-dev-xyz) to npmjs.com
#
# - Assumes that pnpm is set up correctly and that dependencies are installed.
name: Publish Snapshots
description: Publish development snapshots to the npm registry
inputs:
  npm-token:
    description: NPM token for publishing packages
    required: true
  snapshot-tag:
    description: Name of the snapshot build tag. Must be "dev" or start with "dev-".
    required: false
    default: "dev"
  build-command:
    description: Command to build packages (e.g. "build-packages")
    required: false
    default: "build-packages"
runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        SNAPSHOT_TAG: ${{ inputs.snapshot-tag }}
      run: |
        set -eu


        case "$SNAPSHOT_TAG" in
          dev | dev-*) ;;
          *)
            echo "::error::Invalid snapshot-tag '$SNAPSHOT_TAG'."
            echo "::error::Use \"dev\" for the main branch, or \"dev-<name>\" for other branches."
            exit 1
            ;;
        esac
        echo "snapshot-tag: $SNAPSHOT_TAG"

    # Bumps versions in package.json (see https://github.com/changesets/changesets/blob/main/docs/snapshot-releases.md)
    # The changes should not be committed to any branch: the "releases" are not part of the version history.
    - name: Version packages
      shell: bash
      env:
        SNAPSHOT_TAG: ${{ inputs.snapshot-tag }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -eu
        echo "Publishing snapshot from $REF_NAME using tag $SNAPSHOT_TAG"
        pnpm changeset version --snapshot "$SNAPSHOT_TAG"

    # Note: must happen after versioning because the updated package.json files will be copied into dist/
    - name: Build packages
      shell: bash
      run: pnpm ${{ inputs.build-command }}

    - name: Publish packages
      shell: bash
      env:
        NPM_TOKEN: ${{ inputs.npm-token }}
        SNAPSHOT_TAG: ${{ inputs.snapshot-tag }}
      run: |
        set -eu

        REGISTRY="https://registry.npmjs.org"
        AUTH_KEY="//${REGISTRY#*://}/:_authToken"

        revoke() { pnpm config delete "$AUTH_KEY" > /dev/null 2>&1 || true; }
        trap revoke EXIT
        pnpm config set "$AUTH_KEY" "$NPM_TOKEN" > /dev/null

        # Fail with a clear message instead of the 404 that npm returns for unauthorized writes.
        if ! WHOAMI=$(pnpm whoami --registry "$REGISTRY" 2>&1); then
          echo "::error::Cannot authenticate against $REGISTRY."
          echo "::error::$WHOAMI"
          echo "::error::Check that the npm token is valid and has write access to the packages."
          exit 1
        fi
        echo "Authenticated as: $WHOAMI"

        pnpm publish -r --registry "$REGISTRY" --access public --tag "$SNAPSHOT_TAG" --no-git-checks --report-summary

    - name: List packages
      shell: bash
      run: |
        echo "Published packages"
        echo "=================="
        echo ""
        jq -r '.publishedPackages | sort_by(.name) | .[] | "- \(.name)@\(.version)"' pnpm-publish-summary.json
