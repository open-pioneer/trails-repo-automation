# Publishes package snapshots (-dev-xyz) to npmjs.com
#
# - Assumes that pnpm is set up correctly and that dependencies are installed.
# - Authenticates via pnpm's `pnpm_config_*` environment variable support (pnpm >= 11.6), so no
#   .npmrc is needed and the caller does not have to run `install` with `npm-auth: true`.
name: Publish Snapshots
description: Publish development snapshots to the npm registry
inputs:
  npm-token:
    description: NPM token for publishing packages
    required: true
  snapshot-tag:
    description: Name of the snapshot build tag. Must be "dev" or start with "dev-".
    required: false
    default: "dev"
  build-command:
    description: Command to build packages (e.g. "build-packages")
    required: false
    default: "build-packages"
runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        SNAPSHOT_TAG: ${{ inputs.snapshot-tag }}
      run: |
        set -eu

        # Credentials are passed via `pnpm_config_//<registry>/:_authToken`, which older pnpm
        # ignores *silently* - the publish then fails with an opaque "404 Not Found - PUT".
        PNPM_VERSION=$(pnpm --version)
        MIN_PNPM_VERSION=11.6
        if [ "$(printf '%s\n%s\n' "$MIN_PNPM_VERSION" "$PNPM_VERSION" | sort -V | head -n1)" != "$MIN_PNPM_VERSION" ]; then
          echo "::error::pnpm $PNPM_VERSION is too old: environment variable credentials need >= $MIN_PNPM_VERSION."
          echo "::error::Raise \"packageManager\" in package.json."
          exit 1
        fi
        echo "pnpm: $PNPM_VERSION"

        case "$SNAPSHOT_TAG" in
          dev | dev-*) ;;
          *)
            echo "::error::Invalid snapshot-tag '$SNAPSHOT_TAG'."
            echo "::error::Use \"dev\" for the main branch, or \"dev-<name>\" for other branches."
            exit 1
            ;;
        esac
        echo "snapshot-tag: $SNAPSHOT_TAG"

    # Bumps versions in package.json (see https://github.com/changesets/changesets/blob/main/docs/snapshot-releases.md)
    # The changes should not be committed to any branch: the "releases" are not part of the version history.
    - name: Version packages
      shell: bash
      env:
        SNAPSHOT_TAG: ${{ inputs.snapshot-tag }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -eu
        echo "Publishing snapshot from $REF_NAME using tag $SNAPSHOT_TAG"
        pnpm changeset version --snapshot "$SNAPSHOT_TAG"

    # Note: must happen after versioning because the updated package.json files will be copied into dist/
    - name: Build packages
      shell: bash
      run: pnpm ${{ inputs.build-command }}

    - name: Publish packages
      shell: bash
      env:
        NPM_TOKEN: ${{ inputs.npm-token }}
        SNAPSHOT_TAG: ${{ inputs.snapshot-tag }}
      run: |
        set -eu

        echo $NPM_TOKEN

        # The variable name contains "/" and ":", which bash cannot assign, so pass it via `env`.
        # See https://pnpm.io/npmrc
        env "pnpm_config_//registry.npmjs.org/:_authToken=$NPM_TOKEN" \
          pnpm publish -r --registry https://registry.npmjs.org --access public --tag "$SNAPSHOT_TAG" --no-git-checks --report-summary

    - name: List packages
      shell: bash
      run: |
        echo "Published packages"
        echo "=================="
        echo ""
        jq -r '.publishedPackages | sort_by(.name) | .[] | "- \(.name)@\(.version)"' pnpm-publish-summary.json
